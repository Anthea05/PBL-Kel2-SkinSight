name: skinsight
description: SkinSight - modern Flutter prototype for skin condition screening.
publish_to: "none"
version: 1.1.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  camera: ^0.12.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/images/glossy_mint_skincare_mascot_splash.png
  fonts:
    - family: Kalam
      fonts:
        - asset: lib/assets/fonts/Kalam-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Kalam-Bold.ttf
          weight: 700
