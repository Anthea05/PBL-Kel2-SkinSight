[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # Starlette 1.7 menyarankan paket httpx2 untuk TestClient. Proyek ini tetap memakai httpx
    # (juga dipakai ML_MODE=remote) dan versi starlette di-pin di requirements.txt.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
