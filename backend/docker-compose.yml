# Jalankan dari folder backend/:   docker compose up -d --build
# Nilai ${...} dibaca dari file .env di folder yang sama.
name: skinsight

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-skinsight}
    ports:
      # Port host 5433 agar tidak bentrok dengan PostgreSQL lokal yang biasanya memakai 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      # Menimpa nilai di .env agar API di dalam container terhubung ke service "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skinsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skinsight}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skinsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skinsight}_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./ml_models:/app/ml_models:ro
      - scan_storage:/app/storage

volumes:
  pgdata:
  scan_storage:
